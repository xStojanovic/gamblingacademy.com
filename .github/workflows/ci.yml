name: OpsAcademy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate modular source
        run: npm run check:all
      - name: Production build
        run: npm run build
